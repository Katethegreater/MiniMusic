name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK packages
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;34.0.0'

      - name: Build and lint the debug APK
        run: ./gradlew --no-daemon assembleDebug lintDebug

      - name: Upload the debug APK
        uses: actions/upload-artifact@v6
        with:
          name: MiniMusic-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the built APK
        uses: actions/download-artifact@v5
        with:
          name: MiniMusic-debug-apk

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mv app-debug.apk MiniMusic.apk
          gh release create "$RELEASE_TAG" MiniMusic.apk \
            --verify-tag \
            --title "MiniMusic $RELEASE_TAG" \
            --notes "Download MiniMusic.apk from Assets and open it on an Android phone to install this debug build."
